[project]
name = "nexus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EslamWalid", email = "eslamwalid9000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.150.1",
    "fastapi>=0.163.2",
    "flagembedding>=1.4.2",
    "langchain-docling>=3.0.0",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.5.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nexus = "nexus:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]


[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]
extend-exclude = ["notebook"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
